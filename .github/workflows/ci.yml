name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # windows-latest, matching Styx and Hermod, and here it is more than habit:
    # NtsKeDefaultCertificateTests asserts that Norn's self-signed NTS-KE certificate
    # is accepted by a .NET SslStream client, which on Windows means SChannel/CNG. That
    # test exists because SChannel rejects a certificate carrying explicit EC parameters
    # outright while BouncyCastle and GnuTLS accept it — a deviation nothing else caught.
    # On Linux the same test would exercise OpenSSL and quietly stop asserting the thing
    # it was written for. Linux is worth adding as a second matrix entry; it is not a
    # replacement for this one.
    runs-on: windows-latest
    steps:
      # Before the checkout, not after: Hermod carries FontAwesome icon files whose
      # paths exceed MAX_PATH once nested under the runner's workspace and libs/Hermod.
      # Without this the submodule checkout fails with "Filename too long" and leaves
      # the working tree half-populated. Seen for real on a local clone.
      - name: Allow long paths
        run: git config --system core.longpaths true

      # The three submodules are the system under test, so they have to come along.
      # .gitmodules resolves them from the public GitHub mirrors over HTTPS, so no
      # credentials or deploy keys are involved.
      #
      # Note what this pins, in contrast to Hermod's own workflow: that one checks out
      # Styx master and therefore turns red when Styx moves. Here the submodule pointers
      # are exact commits, so a red run means something in *this* repository or in the
      # Norn revision it points at — never someone else's push. Moving to a newer Hermod
      # is a commit here, and gets reviewed like one.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The whole solution: the conformance and interop projects, the harness, and
      # NornTests. Building Norn's own suite here is deliberate — a change to Norn that
      # keeps this suite green while breaking Norn's own tests is still a regression.
      - name: Build
        run: dotnet build NTSConformanceTests.slnx --configuration Release

      # The hermetic gate: everything that needs no network and no WSL. 268 tests,
      # including NornTests' 70. Roughly 40 seconds locally.
      #
      # Three categories stay out, each for a different reason:
      #
      #   Online     — queries Cloudflare, PTB and Netnod for real. Datacentre egress on
      #                UDP/123 and TCP/4460 is commonly blocked or rate-limited, so these
      #                would fail for reasons that say nothing about Norn. nightly.yml
      #                runs them non-fatally instead.
      #   WSL        — needs a Windows host with WSL and chrony/ntpsec/gnutls installed.
      #                Hosted runners have no WSL at all, so this lane cannot run in CI
      #                and stays a local, pre-merge check. Worth knowing rather than
      #                assuming it is covered here.
      #   KnownIssue — currently empty. It is the escape hatch for pinning a confirmed
      #                RFC deviation with a deliberately red test while it is open,
      #                without the gate going red with it.
      #
      # Tests whose prerequisites are missing call Assert.Ignore with an actionable
      # message rather than failing, so a bare checkout is always green-or-skipped.
      - name: Test (hermetic gate)
        timeout-minutes: 30
        run: dotnet test NTSConformanceTests.slnx --configuration Release --no-build --filter "TestCategory!=Online&TestCategory!=WSL&TestCategory!=KnownIssue" --logger "console;verbosity=normal"

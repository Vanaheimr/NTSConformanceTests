name: Nightly

# The counterpart to ci.yml, which gates every push on the offline tests alone.
# This runs the two lanes that cannot gate a merge — the ones that drive real
# chronyd, ntpd-rs and gnutls-cli processes, and the ones that query public NTS
# servers — plus the question the gate structurally cannot ask: does the suite
# still agree with Norn's *current* master, rather than with the revision the
# gitlinks pin?
#
# The interop lane is the main reason this workflow exists. On the Windows
# developer machine those tools live inside WSL, and the reverse direction —
# chronyd or ntpd-rs as a *client* against a Norn server on the host — needs
# inbound TCP and UDP from the WSL subnet, which Windows Firewall blocks by
# default; on a current dev-box run, 18 of 30 interop tests skip for exactly
# that reason. In this container the tools are native, on the same loopback as
# the server under test, with no firewall in between — so all of them run.
#
# Two things worth knowing about scheduled workflows: they only ever run on the
# default branch, and GitHub disables them after 60 days without repository
# activity. If this stops reporting, that is the first thing to check.
on:
  schedule:
    # 03:23 UTC. Off the hour on purpose: GitHub's scheduler is busiest then
    # and delays runs by tens of minutes.
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # The full suite against the pinned submodules, on both platforms.
  # ---------------------------------------------------------------------------
  full-suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    name: full-suite (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:

      # git must be installed BEFORE the checkout: without a git binary,
      # actions/checkout silently falls back to a REST tarball, which cannot
      # fetch submodules — and libs/Norn IS the system under test.
      - name: Install git and the .NET prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      # The interop peers, native. trixie ships chrony 4.6.1 (built with +NTS —
      # the fixtures check the version banner and would skip, saying so, if it
      # were not) and ntpd-rs 1.4.0, the exact versions the README documents
      # for the WSL setup, so this lane and the developer machine judge Norn by
      # the same peers.
      #
      # The last three packages are fixture plumbing rather than peers, and
      # none of them is in the bare container: openssl generates the throwaway
      # server certificates, iproute2 provides the `ss` the fixtures poll until
      # chronyd/ntp-daemon listen, and procps provides the `pkill` their
      # teardown uses.
      - name: Install the NTS tools (Debian container)
        if: runner.os == 'Linux'
        run: apt-get install -y --no-install-recommends chrony ntpd-rs gnutls-bin openssl iproute2 procps

      # Same reason as in ci.yml: without core.longpaths the Windows submodule
      # checkout dies on Hermod's FontAwesome paths with "Filename too long".
      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build NTSConformanceTests.slnx --configuration Release

      # Fatal: the same set the gate runs. Repeating it nightly catches tests
      # that only fail sometimes.
      - name: Test (offline gate)
        timeout-minutes: 30
        run: >
          dotnet test NTSConformanceTests.slnx --configuration Release --no-build
          --filter "TestCategory!=Online&TestCategory!=WSL&TestCategory!=KnownIssue"
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=offline-${{ matrix.leg }}"
          --results-directory artifacts

      # Fatal on Linux, where the tools are present and on the same loopback: a
      # red here is a real interoperability regression — chronyd, ntpd-rs or
      # gnutls-cli disagreeing with what Norn put on the wire, in either
      # direction. On Windows there is no WSL on a hosted runner, so every test
      # in this category skips with that reason and the step passes trivially.
      - name: Test (interop against chronyd, ntpd-rs, gnutls-cli)
        timeout-minutes: 45
        run: >
          dotnet test NTSConformanceTests.slnx --configuration Release --no-build
          --filter "TestCategory=WSL"
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=interop-${{ matrix.leg }}"
          --results-directory artifacts

      # Informational, and it has to be. These run real NTS sessions against
      # Cloudflare, PTB, Netnod and time.nl, and a hosted runner is not a
      # normal client: datacentre egress on UDP/123 is often filtered, TCP/4460
      # is not universally reachable, and public servers may rate-limit these
      # address ranges. A failure here means "the runner could not ask", which
      # says nothing about Norn — so it must not be able to turn the night red.
      # Read the numbers for a trend; a sudden failure of every server at once
      # IS worth looking at.
      - name: Test (public NTS servers, informational)
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test NTSConformanceTests.slnx --configuration Release --no-build \
            --filter "TestCategory=Online" --logger "console;verbosity=normal" \
            --logger "trx;LogFilePrefix=online-${{ matrix.leg }}" \
            --results-directory artifacts 2>&1 | tee online.txt
          {
            echo '## Public NTS servers (informational, ${{ matrix.leg }})'
            echo
            echo 'Network-dependent: failures here reflect runner egress, not Norn.'
            echo
            echo '```'
            grep -E "Passed!|Failed!|error|Passed:|Failed:" online.txt || tail -5 online.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # TRX preserves the skip reasons — which is most of what the interop lane
      # says on a leg where a tool is missing, and the evidence when a lane
      # goes red.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-nightly-${{ matrix.leg }}
          path: artifacts/*.trx

  # ---------------------------------------------------------------------------
  # The referee job: the same suite against Norn's current master.
  # ---------------------------------------------------------------------------
  against-norn-master:
    # The gate above tests the revision the gitlinks pin, which is the right
    # question for "would a fresh clone build". It is the wrong question for
    # what this repository claims to be — an adversarial referee that can be
    # pointed at any Norn revision. Nothing in the gate notices when Norn
    # moves, because a push to Norn does not touch this repository at all.
    #
    # So: check all three submodules out at master and run the offline suite
    # against them. Red here means Norn (or Hermod or Styx underneath it)
    # changed in a way the suite disagrees with, and it is a finding rather
    # than a build failure — which is why this job is separate from the one
    # above, and why the interop and online lanes are left out. One question at
    # a time.
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install git and the .NET prerequisites (Debian container)
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Move the submodules to master
        run: |
          git config --global --add safe.directory '*'
          git submodule foreach 'git fetch origin master && git checkout FETCH_HEAD'
          echo "### Submodule revisions under test" >> "$GITHUB_STEP_SUMMARY"
          git submodule status >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build NTSConformanceTests.slnx --configuration Release

      - name: Test (offline gate, against Norn master)
        timeout-minutes: 30
        run: >
          dotnet test NTSConformanceTests.slnx --configuration Release --no-build
          --filter "TestCategory!=Online&TestCategory!=WSL&TestCategory!=KnownIssue"
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=offline-norn-master"
          --results-directory artifacts

      # This is the one job whose red is a finding rather than a breakage, and
      # it was the only one keeping no record of it. A referee that reports
      # "Norn master disagrees" without naming the checks sends whoever reads it
      # back to reproduce the whole thing by hand -- and the console log it had
      # instead is gone once the run ages out. The TRX files name the checks and
      # their messages; together with the submodule revisions the step above
      # already writes into the summary, that is enough to reproduce a
      # disagreement without first guessing which commit moved.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-against-norn-master
          path: artifacts/*.trx

  # ---------------------------------------------------------------------------
  # The upstream-peer lane: the interop suite against chrony and ntpd-rs as
  # their own projects ship them, rather than as Debian does.
  # ---------------------------------------------------------------------------
  upstream-tools:
    # The full-suite job above judges Norn against what Debian 13 packages —
    # chrony 4.6.1 and ntpd-rs 1.4.0 — and that is the right default: it is
    # what a developer's WSL has, which is what keeps the desk and CI
    # comparable. But upstream has moved. chrony is at 4.9 (August 2026) and
    # ntpd-rs at 1.9.0 (June 2026), and those are the peers a deployed Norn
    # would actually meet. A disagreement that appears only against a current
    # peer is invisible to every other job in this repository.
    #
    # Only the interop category runs here. The offline gate never touches an
    # external peer, so running it against newer ones would prove nothing that
    # the jobs above have not already proven twice.
    #
    # Informational, for a reason close to the public-server lane's: a red here
    # can mean Norn is wrong, or that a peer changed its behaviour on purpose,
    # or that one of the two downloads below moved — and only the first is a
    # finding about this repository. So it must not be able to turn the night
    # red. The step summary carries both version banners and the outcome, so a
    # real disagreement is not something anybody has to go hunting for.
    continue-on-error: true
    runs-on: ubuntu-latest
    # CAP_SYS_TIME, which the other Linux jobs do without. The first honest run
    # of this lane earned this line: upstream chronyd exited at startup with
    #
    #     adjtimex(0x8001) failed : Operation not permitted
    #
    # and 0x8001 is ADJ_OFFSET_SINGLESHOT -- a one-shot step of the system
    # clock, which a container is not granted by default. chronyd treats the
    # refusal as fatal, so it never bound a socket and all ten chrony checks
    # skipped themselves.
    #
    # Worth knowing before changing this: the fatality is not new, 4.6.1 has
    # the identical LOGS_FATAL in sys_timex.c, and 4.6.1 nevertheless starts in
    # this same image -- the pinned-peer lane above proves it every night. So
    # 4.9 reaches a clock-stepping call that 4.6.1 does not. A likely candidate
    # is the clock-interference check 4.9 added to that same function, which
    # 4.6.1 does not have, but that is a guess and the EPERM is the fact.
    #
    # Granting the capability rather than passing chronyd -x: the fixtures are
    # shared with the pinned lane, and the whole value of this one is that the
    # peer versions are the only thing that differs. Nothing here can steal the
    # runner's clock either way -- the fixture configures no sources, so there
    # is nothing to slew towards, and the runner is torn down afterwards.
    container:
      image: debian:13
      options: --cap-add=SYS_TIME
    env:
      # Bumping a peer is a one-line edit here. The hashes are pinned so that a
      # re-tagged or replaced artefact fails the download loudly instead of
      # quietly changing what this lane measured. ntpd-rs's is the hash its own
      # release SHA256SUMS publishes; chrony ships only a PGP signature, so its
      # hash was taken from the tarball this lane was written against and
      # attests continuity rather than authorship.
      CHRONY_VERSION:     '4.9'
      CHRONY_SHA256:      '4924c6f530105bcd5b9e9e33c48a2ae1bfd889222c8480bc41601110efc864d0'
      NTPD_RS_VERSION:    '1.9.0'
      NTPD_RS_DEB_SHA256: 'bfb1cb83bdc3705ef6a945ed81b00d8da2443057e57dfb8e7f4b61f695317a4d'
    steps:

      # git before the checkout, as in every other job here: without a git
      # binary actions/checkout falls back to a REST tarball, which cannot
      # fetch submodules — and libs/Norn IS the system under test.
      - name: Install git and the .NET prerequisites (Debian container)
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      # The distro packages go on first and then have their binaries replaced,
      # which sounds backwards but is not: the Debian packaging is what creates
      # the _chrony user that ChronyNtsServerFixture chowns its certificate and
      # key to, and what brings the plumbing the fixtures drive — openssl for
      # the throwaway certificates, iproute2 for the `ss` they poll until a
      # daemon listens, procps for the `pkill` in their teardown. gnutls-bin is
      # a peer in its own right and deliberately stays at trixie's version:
      # this lane is about the two time daemons, and holding everything else
      # still is what makes its answer readable.
      #
      # The rest is chrony's build dependency set. GnuTLS and Nettle are what
      # NTS itself needs, libcap gives +PRIVDROP (the fixture's configuration
      # depends on the privilege drop happening), libseccomp gives +SCFILTER.
      - name: Install the distro peers and chrony's build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            chrony ntpd-rs gnutls-bin openssl iproute2 procps \
            gcc make pkg-config libgnutls28-dev nettle-dev libcap-dev libseccomp-dev

      # The .deb is unpacked rather than installed, which is not the obvious
      # choice and is the one that works. Upstream's package declares
      # `Conflicts: time-daemon`, and Debian's chrony *provides* time-daemon --
      # so with chrony already on, and it has to be for the _chrony user and
      # the fixture plumbing, dpkg refuses outright: "conflicting packages -
      # not installing ntpd-rs". Debian's own ntpd-rs carries no such conflict,
      # which is why the apt line above can ask for both.
      #
      # Unpacking sidesteps a packaging policy this lane has no stake in. What
      # it wants is the newer binaries at the paths the fixtures use --
      # TestEnvironment.RequireNtpdRs looks for ntp-daemon and ntp-ctl, and
      # nothing here starts a service or consults the package database. It also
      # makes this symmetric with the chrony step below, which likewise just
      # replaces two binaries, and immune to upstream editing its control
      # metadata again. The versions this lane reports come from the binaries'
      # own banners, so a stale dpkg database is harmless and not load-bearing.
      - name: Install upstream ntpd-rs
        run: |
          cd /tmp
          curl -fsSLO "https://github.com/pendulum-project/ntpd-rs/releases/download/v${NTPD_RS_VERSION}/ntpd-rs_${NTPD_RS_VERSION}-1_amd64.deb"
          echo "${NTPD_RS_DEB_SHA256}  ntpd-rs_${NTPD_RS_VERSION}-1_amd64.deb" | sha256sum -c -
          dpkg-deb -x "ntpd-rs_${NTPD_RS_VERSION}-1_amd64.deb" ntpd-rs-unpacked
          install -m 755 ntpd-rs-unpacked/usr/bin/ntp-daemon /usr/bin/ntp-daemon
          install -m 755 ntpd-rs-unpacked/usr/bin/ntp-ctl    /usr/bin/ntp-ctl

      # chrony publishes no .deb, so it is built from the release tarball.
      #
      # --enable-scfilter and --enable-ntp-signd are not decoration: Debian
      # builds with both, and without them the version banner would differ from
      # trixie's in ways that have nothing to do with the version, leaving a
      # reader of this lane unable to tell a 4.9 change from a build change.
      # With them the only banner difference left is that 4.9 no longer prints
      # +NTP and +ASYNCDNS; both features are still present (nameserv_async.c
      # is still in the tree), they are simply unconditional now.
      #
      # The two binaries are copied rather than `make install`ed, because that
      # target also recurses into doc/ to install man pages this container has
      # no reader for. /usr/sbin/chronyd is the path the fixture starts by
      # absolute name and chronyc is found on PATH; both are replaced, so
      # nothing can quietly go on testing 4.6.1.
      - name: Build and install upstream chrony
        run: |
          cd /tmp
          curl -fsSLO "https://chrony-project.org/releases/chrony-${CHRONY_VERSION}.tar.gz"
          echo "${CHRONY_SHA256}  chrony-${CHRONY_VERSION}.tar.gz" | sha256sum -c -
          tar xzf "chrony-${CHRONY_VERSION}.tar.gz"
          cd "chrony-${CHRONY_VERSION}"
          ./configure --prefix=/usr --sbindir=/usr/sbin --bindir=/usr/bin --sysconfdir=/etc \
                      --enable-scfilter --enable-ntp-signd
          make -j"$(nproc)"
          install -m 755 chronyd /usr/sbin/chronyd
          install -m 755 chronyc /usr/bin/chronyc

      # Written down before any test runs, so that a job which dies later still
      # says what it was holding. The fixtures gate on these same banners:
      # chronyd must report +NTS or every chrony check skips itself, and
      # ntp-daemon must name itself in its own banner.
      #
      # tee rather than a plain redirect, so the banners reach the step log as
      # well as the summary. Anybody investigating a red lane from the command
      # line reads the log, and a redirect would have left the one fact they
      # need -- which versions this was -- visible only in a browser.
      - name: Record the peer versions
        run: |
          {
            echo '## Upstream peers under test'
            echo
            echo '```'
            /usr/sbin/chronyd --version
            ntp-daemon --version
            gnutls-cli --version | head -1
            echo '```'
            echo
            echo 'Debian 13 for comparison: chrony 4.6.1 and ntpd-rs 1.4.0 — the'
            echo 'versions the full-suite job tests, and the ones a developer WSL has.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A lane whose peers quietly fail to start is worse than no lane at all.
      # Every check that needs a daemon calls Assert.Ignore when it cannot get
      # one, NUnit counts that as a skip rather than a failure, and the job goes
      # green having proved nothing. That is precisely what this lane's first
      # working run did: 17 passed, 13 skipped, both daemons never up, job
      # green. So the peers are smoke-tested here, before the suite is allowed
      # to draw conclusions from them, and the step is fatal.
      #
      # The two configurations mirror what ChronyNtsServerFixture and
      # NtpdRsNtsServerFixture write, down to the _chrony chown and the
      # 'user root' that lets chronyd read its key after the privilege drop.
      # The difference is that this keeps each daemon's own output instead of
      # discarding it: the fixtures have four separate ways to give up and one
      # message for all of them, which is enough to know that a peer did not
      # come up and never enough to know why.
      #
      # The port counts match the fixtures' own bar — they wait for at least
      # two listening sockets, which is what an IPv4 and IPv6 bind of the NTP
      # and NTS-KE ports produces.
      - name: Smoke-test that both peers actually start
        run: |
          mkdir -p /tmp/smoke
          cd /tmp/smoke
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -keyout key.pem -out cert.pem -days 1 -subj '/CN=smoke.test' \
            -addext 'subjectAltName=DNS:smoke.test,IP:127.0.0.1' >/dev/null 2>&1
          chmod 644 cert.pem
          chmod 640 key.pem
          chmod 755 /tmp/smoke
          chown _chrony:_chrony cert.pem key.pem /tmp/smoke 2>/dev/null || true

          printf '%s\n' 'port 24567' 'ntsport 24568' \
            'ntsservercert /tmp/smoke/cert.pem' 'ntsserverkey /tmp/smoke/key.pem' \
            'ntsdumpdir /tmp/smoke' 'user root' 'local stratum 10' 'allow all' \
            'bindaddress 0.0.0.0' 'driftfile /tmp/smoke/drift' > chrony.conf

          echo '--- chronyd, started the way the fixture starts it ---'
          /usr/sbin/chronyd -f /tmp/smoke/chrony.conf -L 0 > chronyd.out 2>&1 || true
          sleep 5
          echo 'its output:'
          sed 's/^/  /' chronyd.out || true
          chrony_up=$(ss -lntu 2>/dev/null | grep -c -E ':(24567|24568)' || true)
          echo "listening sockets: ${chrony_up} (the fixture needs 2)"
          pkill -x chronyd 2>/dev/null || true
          sleep 1

          printf '%s\n' '[observability]' 'log-level = "info"' '' \
            '[synchronization]' 'local-stratum = 10' '' \
            '[[server]]' 'listen = "0.0.0.0:34567"' '' \
            '[[nts-ke-server]]' 'listen = "0.0.0.0:34568"' \
            'certificate-chain-path = "/tmp/smoke/cert.pem"' \
            'private-key-path = "/tmp/smoke/key.pem"' 'ntp-port = 34567' > ntp.toml

          echo '--- ntp-daemon, started the way the fixture starts it ---'
          ntp-ctl validate -c /tmp/smoke/ntp.toml || true
          ntp-daemon -c /tmp/smoke/ntp.toml > ntpd.out 2>&1 &
          sleep 5
          echo 'its output:'
          sed 's/^/  /' ntpd.out || true
          ntpd_up=$(ss -lntu 2>/dev/null | grep -c -E ':(34567|34568)' || true)
          echo "listening sockets: ${ntpd_up} (the fixture needs 2)"
          pkill -x ntp-daemon 2>/dev/null || true

          ok=0
          [ "${chrony_up}" -ge 2 ] || { echo 'FAIL: upstream chronyd did not listen'; ok=1; }
          [ "${ntpd_up}" -ge 2 ]   || { echo 'FAIL: upstream ntp-daemon did not listen'; ok=1; }
          if [ "${ok}" -ne 0 ]; then
            {
              echo
              echo '### A peer did not start'
              echo
              echo 'The interop checks were not run: with no daemon they would have'
              echo 'skipped themselves and left this job green on 0 evidence. The step'
              echo 'log has each daemon output verbatim.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build NTSConformanceTests.slnx --configuration Release

      # The same filter the pinned-peer interop lane uses, so the two are
      # directly comparable. A failure is left to fail: the job's
      # continue-on-error keeps it off the workflow's result, and a step that
      # swallowed its own exit code would make this job look healthy in the one
      # case worth reading.
      #
      # A skip is treated as a failure here, which is the opposite of what it
      # means everywhere else in this repository. Elsewhere a skipped interop
      # check is honest reporting — no WSL on a Windows runner, no chronyd on a
      # bare machine — and the pinned lane relies on that. In this lane the
      # peers are installed three steps up and smoke-tested two steps up, so a
      # check that skips anyway is a check that could not use a peer that
      # demonstrably works, and reading the job as green would be reading 0
      # evidence as agreement. The pinned lane's count is the bar: 30 of 30.
      - name: Test (interop against upstream chrony and ntpd-rs)
        timeout-minutes: 45
        run: |
          if dotnet test NTSConformanceTests.slnx --configuration Release --no-build \
               --filter "TestCategory=WSL" \
               --logger "console;verbosity=normal" \
               --logger "trx;LogFilePrefix=upstream-interop" \
               --results-directory artifacts > test.out 2>&1
          then rc=0
          else rc=$?
          fi
          cat test.out
          # tail -1, not a sum: dotnet test prints either one line per assembly
          # or one grand total depending on the SDK, and on a version that
          # prints both, summing would double-count and put a wrong number in
          # the summary. Only the interop assembly runs under this filter, so
          # the last occurrence is the authoritative one either way. The
          # defaults cover a run that died before summarizing -- rc catches
          # that first, but an empty string in the test below is a dash error
          # rather than a verdict.
          skipped=$(grep -oE 'Skipped: +[0-9]+' test.out | grep -oE '[0-9]+' | tail -1)
          passed=$(grep -oE 'Passed: +[0-9]+' test.out | grep -oE '[0-9]+' | tail -1)
          : "${skipped:=0}"
          : "${passed:=0}"
          {
            echo
            echo '### Interop counts against the upstream peers'
            echo
            echo "passed ${passed}, skipped ${skipped} (the pinned-peer lane: 30 passed, 0 skipped)"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${rc}" -eq 0 ] || exit "${rc}"
          if [ "${skipped}" -ne 0 ]; then
            echo "FAIL: ${skipped} interop checks skipped although both peers started."
            exit 1
          fi

      # always(), because the outcome matters most when the step above failed.
      - name: Summarize the outcome
        if: ${{ always() }}
        run: |
          {
            echo
            echo '### Interop against the upstream peers'
            echo
            if [ '${{ job.status }}' = 'success' ]; then
              echo 'Agreed with both, as the pinned-peer lane does.'
            else
              echo 'Disagreed, or could not run. This lane is informational: the cause'
              echo "can be Norn, a deliberate change in a peer, or this lane's own"
              echo 'provisioning. The TRX artifact names the checks and their reasons.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # TRX preserves the per-check outcome and every skip reason, which is the
      # evidence when a peer and Norn stop agreeing.
      - name: Upload test results
        if: ${{ !cancelled() }}
